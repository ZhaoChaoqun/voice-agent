# Public listener for the self-hosted portal (runs as non-root inside the container).
#
# The portal only accepts Host=loopback and an Origin equal to its own loopback origin.
# This proxy presents every request as loopback, but rewrites Origin ONLY when the
# browser's Origin is this site's own HTTPS origin. Any other Origin is forwarded
# unchanged, so the portal's cross-origin guard still rejects cross-site requests.
# Who may reach this listener at all is decided in front of it (Entra sign-in or
# IP allowlist on the Container App ingress), not here.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    # Request URLs can carry structured input; never write them to an access log.
    access_log off;
    server_tokens off;
    client_max_body_size 4m;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        "" close;
    }

    # Key is "<Origin>|<Host>". Same-site HTTPS origin -> the portal's loopback origin.
    # Missing Origin stays missing (an empty proxy_set_header value drops the header).
    map "$http_origin|$host" $portal_origin {
        default $http_origin;
        "~^https://([^|/]+)\|\1$" "http://127.0.0.1:9527";
    }

    server {
        listen 8080 default_server;

        location / {
            proxy_pass http://127.0.0.1:9527;
            proxy_http_version 1.1;
            proxy_set_header Host "127.0.0.1:9527";
            proxy_set_header Origin $portal_origin;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Forwarded-Host "";
            proxy_buffering off;
            proxy_request_buffering off;
            # A voice session is one long WebSocket; audio frames keep it busy.
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }
}
