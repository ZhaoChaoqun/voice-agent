<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="800" viewBox="0 0 1480 800" font-family="'Segoe UI', 'Liberation Sans', Arial, sans-serif">
  <defs>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#1B2A4A" flood-opacity="0.10"/></filter>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3B4250"/></marker>
    <marker id="ahp" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#6B4FBB"/></marker>
  </defs>
  <rect width="1480" height="800" fill="#FFFFFF"/>
  <text x="36" y="52" font-size="27" font-weight="700" fill="#1B1F27">How the portal fits into your Azure environment</text>
  <text x="36" y="82" font-size="16" fill="#5B6270">The portal runs in your subscription and calls your Foundry project with its own managed identity</text>

  <!-- subscription region -->
  <rect x="280" y="120" width="890" height="530" rx="20" fill="#F5F9FF" stroke="#0F6CBD" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="304" y="150" font-size="14" font-weight="700" letter-spacing="1.2" fill="#0F6CBD">YOUR AZURE SUBSCRIPTION</text>

  <!-- resource group -->
  <rect id="rg" x="310" y="170" width="400" height="450" rx="14" fill="#FFFFFF" stroke="#C9D6EA"/>
  <text data-box="rg" x="330" y="200" font-size="15" font-weight="700" fill="#1B1F27">Resource group · voice-agent-portal</text>
  <text data-box="rg" x="330" y="221" font-size="13" fill="#6A7180">Created by deployment steps 1 and 2</text>
  <g filter="url(#sh)">
    <rect id="app" x="330" y="240" width="360" height="210" rx="12" fill="#FFFFFF" stroke="#0F6CBD" stroke-width="1.5"/>
  </g>
  <path d="M330 252 a12 12 0 0 1 12 -12 h336 a12 12 0 0 1 12 12 v38 h-360 z" fill="#0F6CBD"/>
  <text data-box="app" x="350" y="272" font-size="18" font-weight="700" fill="#FFFFFF">Voice Agent Portal</text>
  <text x="670" y="271" text-anchor="end" font-size="12.5" fill="#DCEBFA">Azure Container App</text>
  <g font-size="14" font-weight="600" fill="#0F4C8A">
    <rect x="350" y="310" width="96" height="34" rx="17" fill="#E8F1FB"/><text x="398" y="332" text-anchor="middle">Templates</text>
    <rect x="456" y="310" width="124" height="34" rx="17" fill="#E8F1FB"/><text x="518" y="332" text-anchor="middle">Handoff editor</text>
    <rect x="590" y="310" width="86" height="34" rx="17" fill="#E8F1FB"/><text x="633" y="332" text-anchor="middle">Voice test</text>
  </g>
  <text data-box="app" x="350" y="382" font-size="14" fill="#3B4250">Web UI and API in one container</text>
  <text data-box="app" x="350" y="404" font-size="14" fill="#3B4250">Holds no agents: everything is saved</text>
  <text data-box="app" x="350" y="426" font-size="14" fill="#3B4250">in your Foundry project</text>
  <g font-size="14" fill="#1B1F27">
    <rect id="t1" x="330" y="476" width="112" height="120" rx="10" fill="#F7F9FC" stroke="#DCE3EE"/>
    <text data-box="t1" x="344" y="506" font-weight="700">Container</text><text data-box="t1" x="344" y="525" font-weight="700">Registry</text>
    <text data-box="t1" x="344" y="552" font-size="12.5" fill="#6A7180">portal image,</text><text data-box="t1" x="344" y="569" font-size="12.5" fill="#6A7180">built in Azure</text>
    <rect id="t2" x="454" y="476" width="112" height="120" rx="10" fill="#F7F9FC" stroke="#DCE3EE"/>
    <text data-box="t2" x="468" y="506" font-weight="700">Managed</text><text data-box="t2" x="468" y="525" font-weight="700">identity</text>
    <text data-box="t2" x="468" y="552" font-size="12.5" fill="#6A7180">the portal's</text><text data-box="t2" x="468" y="569" font-size="12.5" fill="#6A7180">only credential</text>
    <rect id="t3" x="578" y="476" width="112" height="120" rx="10" fill="#F7F9FC" stroke="#DCE3EE"/>
    <text data-box="t3" x="592" y="506" font-weight="700">Log</text><text data-box="t3" x="592" y="525" font-weight="700">Analytics</text>
    <text data-box="t3" x="592" y="552" font-size="12.5" fill="#6A7180">container</text><text data-box="t3" x="592" y="569" font-size="12.5" fill="#6A7180">logs</text>
  </g>

  <!-- Foundry project -->
  <g filter="url(#sh)"><rect id="fp" x="850" y="170" width="290" height="450" rx="14" fill="#FFFFFF" stroke="#6B4FBB" stroke-width="1.5"/></g>
  <path d="M850 184 a14 14 0 0 1 14 -14 h262 a14 14 0 0 1 14 14 v40 h-290 z" fill="#6B4FBB"/>
  <text data-box="fp" x="868" y="203" font-size="17" font-weight="700" fill="#FFFFFF">Microsoft Foundry project</text>
  <text data-box="fp" x="868" y="246" font-size="13" fill="#6A7180">Your existing project</text>
  <g font-size="15" font-weight="700" fill="#2E2160">
    <rect id="f1" x="866" y="260" width="258" height="76" rx="10" fill="#F4F0FF"/>
    <text data-box="f1" x="882" y="288">Voice agents</text>
    <text data-box="f1" x="882" y="310" font-size="13" font-weight="400" fill="#5B4E86">versioned definitions,</text><text data-box="f1" x="882" y="327" font-size="13" font-weight="400" fill="#5B4E86">including handoff stages</text>
    <rect id="f2" x="866" y="348" width="258" height="76" rx="10" fill="#F4F0FF"/>
    <text data-box="f2" x="882" y="376">Voice endpoint</text>
    <text data-box="f2" x="882" y="398" font-size="13" font-weight="400" fill="#5B4E86">real-time speech sessions,</text><text data-box="f2" x="882" y="415" font-size="13" font-weight="400" fill="#5B4E86">stage switching, tool calls</text>
    <rect id="f3" x="866" y="436" width="258" height="76" rx="10" fill="#F4F0FF"/>
    <text data-box="f3" x="882" y="464">Conversations &amp; traces</text>
    <text data-box="f3" x="882" y="486" font-size="13" font-weight="400" fill="#5B4E86">recorded by Foundry,</text><text data-box="f3" x="882" y="503" font-size="13" font-weight="400" fill="#5B4E86">not by the portal</text>
    <rect id="f4" x="866" y="524" width="258" height="80" rx="10" fill="#FFFFFF" stroke="#B9A8E6" stroke-dasharray="5 4"/>
    <text data-box="f4" x="882" y="552" font-size="14">Only change to the project</text>
    <text data-box="f4" x="882" y="574" font-size="13" font-weight="400" fill="#5B4E86">Foundry User role for the</text><text data-box="f4" x="882" y="591" font-size="13" font-weight="400" fill="#5B4E86">portal's managed identity</text>
  </g>

  <!-- portal -> Foundry -->
  <line x1="690" y1="345" x2="846" y2="345" stroke="#3B4250" stroke-width="2.2" marker-end="url(#ah)"/>
  <text x="770" y="334" text-anchor="middle" font-size="13" font-weight="700" fill="#1B1F27">API + voice</text>
  <text x="770" y="365" text-anchor="middle" font-size="12.5" fill="#5B6270">managed identity</text>

  <!-- team + front door -->
  <g filter="url(#sh)"><rect id="team" x="36" y="260" width="200" height="150" rx="14" fill="#FFFFFF" stroke="#D5DBE5"/></g>
  <g fill="#3B4250"><circle cx="78" cy="294" r="10"/><path d="M60 322 a18 14 0 0 1 36 0 z"/><circle cx="106" cy="290" r="8" opacity="0.55"/><path d="M92 316 a14 11 0 0 1 28 0 z" opacity="0.55"/></g>
  <text data-box="team" x="56" y="354" font-size="18" font-weight="700" fill="#1B1F27">Your team</text>
  <text data-box="team" x="56" y="376" font-size="14" fill="#4A5160">engineers and testers</text>
  <text data-box="team" x="56" y="395" font-size="14" fill="#4A5160">on office network / VPN</text>
  <line x1="236" y1="345" x2="326" y2="345" stroke="#3B4250" stroke-width="2.2" marker-end="url(#ah)"/>
  <g transform="translate(268,345)"><path d="M0 -17 L14 -11 V1 C14 10 7 15 0 18 C-7 15 -14 10 -14 1 V-11 Z" fill="#CA5010" stroke="#FFFFFF" stroke-width="2"/><path d="M-6 0 L-1 5 L7 -5" stroke="#FFFFFF" stroke-width="2.4" fill="none" stroke-linecap="round"/></g>
  <rect id="door" x="36" y="440" width="200" height="104" rx="12" fill="#FFF4EC"/>
  <text data-box="door" x="52" y="468" font-size="15" font-weight="700" fill="#A3400B">Front door</text>
  <text data-box="door" x="52" y="490" font-size="13.5" fill="#5A3A26">IP allowlist (default)</text>
  <text data-box="door" x="52" y="509" font-size="13.5" fill="#5A3A26">or Microsoft Entra</text>
  <text data-box="door" x="52" y="528" font-size="13.5" fill="#5A3A26">sign-in</text>

  <!-- right column: tools and Foundry portal -->
  <g filter="url(#sh)"><rect id="tools" x="1214" y="260" width="230" height="130" rx="14" fill="#FFFFFF" stroke="#107C41" stroke-width="1.4"/></g>
  <text data-box="tools" x="1232" y="292" font-size="17" font-weight="700" fill="#0B5A2F">Your tools</text>
  <text data-box="tools" x="1232" y="314" font-size="14" fill="#3B4250">MCP servers for CRM,</text>
  <text data-box="tools" x="1232" y="333" font-size="14" fill="#3B4250">booking, ticketing…</text>
  <text data-box="tools" x="1232" y="362" font-size="12.5" fill="#6A7180">called by Foundry during a call</text>
  <line x1="1140" y1="386" x2="1210" y2="340" stroke="#107C41" stroke-width="2" marker-end="url(#ah)"/>
  <g filter="url(#sh)"><rect id="fport" x="1214" y="440" width="230" height="130" rx="14" fill="#FFFFFF" stroke="#6B4FBB" stroke-width="1.4"/></g>
  <text data-box="fport" x="1232" y="472" font-size="17" font-weight="700" fill="#2E2160">Foundry portal</text>
  <text data-box="fport" x="1232" y="494" font-size="14" fill="#3B4250">ai.azure.com</text>
  <text data-box="fport" x="1232" y="523" font-size="12.5" fill="#6A7180">see the same agents,</text>
  <text data-box="fport" x="1232" y="541" font-size="12.5" fill="#6A7180">conversations and traces</text>
  <line x1="1210" y1="490" x2="1144" y2="474" stroke="#6B4FBB" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#ahp)"/>

  <!-- production -->
  <g filter="url(#sh)"><rect id="prod" x="850" y="684" width="290" height="84" rx="14" fill="#FFFFFF" stroke="#3B4250" stroke-width="1.3"/></g>
  <text data-box="prod" x="868" y="716" font-size="16" font-weight="700" fill="#1B1F27">Your production apps</text>
  <text data-box="prod" x="868" y="740" font-size="13" fill="#5B6270">connect straight to the voice</text>
  <text data-box="prod" x="868" y="757" font-size="13" fill="#5B6270">endpoint, not through the portal</text>
  <line x1="995" y1="684" x2="995" y2="624" stroke="#3B4250" stroke-width="2.2" marker-end="url(#ah)"/>

  <!-- build note -->
  <rect id="note" x="310" y="684" width="400" height="84" rx="14" fill="#F2F5F9"/>
  <text data-box="note" x="328" y="716" font-size="15" font-weight="700" fill="#1B1F27">Built and run inside Azure</text>
  <text data-box="note" x="328" y="740" font-size="13" fill="#4A5160">The image is built in your registry, so your</text>
  <text data-box="note" x="328" y="757" font-size="13" fill="#4A5160">network needs no Docker Hub or PyPI access</text>
</svg>
